services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: wildlands-backend
    ports:
      - "5000:5000"
    environment:
      - TZ=Europe/Amsterdam
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile   # ← hier hoort hij
    container_name: wildlands-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped


<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wildlands Bezoekersvoorspelling</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('wildlands_background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      margin: 0;
      padding-top: 60px; /* ruimte boven logo */
      padding-bottom: 60px; /* extra ruimte onderaan */
    }

    /* Logo */
    .logo {
      width: 36%;
      max-width: 420px;
      height: auto;
      margin-top: 0;
      margin-bottom: 60px;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.5));
      transition: transform 0.4s ease;
    }

    .logo:hover {
      transform: scale(1.03);
    }

    /* Kaart */
    .card {
      background: rgba(0, 50, 0, 0.5);
      border-radius: 25px;
      padding: 50px 80px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      text-align: center;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      max-width: 750px;
      width: 90%;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: scale(1.01);
    }

    .card h1 {
      font-size: 2.4em;
      margin-bottom: 25px;
      color: #ffffff;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
    }

    .visitors-line {
      font-size: 3em;
      font-weight: 600;
      color: #ffe066;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
      margin-bottom: 25px;
    }

    .weather {
      font-size: 1.5em;
      margin-top: 10px;
      line-height: 1.6;
    }

    .clock {
      margin-top: 25px;
      font-size: 1.6em;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .footer {
      font-size: 1.2em;
      opacity: 0.9;
      margin-bottom: 25px;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.8s ease-in-out;
    }
  </style>
</head>
<body>
  <!-- Logo -->
  <img src="wildlands_logo.png" alt="Wildlands Logo" class="logo fade-in">

  <!-- Kaart -->
  <div class="card fade-in">
    <h1>Bezoekersvoorspelling</h1>
    <div id="visitors-line" class="visitors-line">Vandaag verwacht: -- bezoekers</div>

    <div class="weather" id="weather">Weerdata ophalen...</div>

    <div class="clock" id="clock"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    🌍 Wildlands Adventure Zoo Emmen — Dagelijkse bezoekersvoorspelling automatisch bijgewerkt
  </div>

  <script>
    async function loadPrediction() {
      try {
        const res = await fetch("http://127.0.0.1:5000/api/predict_today");
        const data = await res.json();

        document.getElementById("visitors-line").innerText =
          `Vandaag verwacht: ${data.predicted_visitors.toLocaleString()} bezoekers`;

        document.getElementById("weather").innerText =
          `🌦️ Temperatuur: ${data.temperature}°C | Regen: ${data.rain_mm} mm ${
            data.vacation ? "| 🏖️ Vakantie" : ""
          } ${data.event ? "| 🎉 Evenement" : ""}`;
      } catch (error) {
        document.getElementById("visitors-line").innerText = "⚠️ Geen verbinding met server";
        console.error("Error fetching prediction:", error);
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").innerText = now.toLocaleTimeString("nl-NL");
    }

    setInterval(updateClock, 1000);
    updateClock();

    loadPrediction();
    setInterval(loadPrediction, 60 * 1000);
  </script>
</body>
</html>

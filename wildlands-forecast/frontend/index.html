<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wildlands Visitor Prediction</title>
</head>
<body>
  <h1>Wildlands Visitor Prediction</h1>
  <h2 id="date"></h2>
  <h3 id="result"></h3>
  <p id="details"></p>

  <script>
    async function fetchPrediction() {
      try {
        const res = await fetch("http://127.0.0.1:5000/api/predict_today");
        const data = await res.json();

        document.getElementById('date').innerText = `📅 Date: ${data.date}`;
        document.getElementById('result').innerText = `📊 Expected Visitors: ${data.predicted_visitors}`;
        document.getElementById('details').innerText =
          `🌡️ Temp: ${data.temperature}°C | 🌧️ Rain: ${data.rain_mm}mm | 🏖️ Vacation: ${data.vacation} | 🎪 Event: ${data.event}`;
      } catch (err) {
        document.getElementById('result').innerText = 'Error fetching prediction: ' + err.message;
      }
    }

    window.onload = fetchPrediction;
  </script>
</body>
</html>

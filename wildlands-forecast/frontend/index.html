<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wildlands Bezoekersvoorspelling</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: url('wildlands_background.jpg') no-repeat center center fixed; background-size: cover; color: white; text-align: center; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; margin: 0; padding-top: 60px; padding-bottom: 60px; }
  .logo { width: 36%; max-width: 420px; height: auto; margin-top: 0; margin-bottom: 60px; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.5)); transition: transform 0.4s ease; }
  .logo:hover { transform: scale(1.03); }
  .card { background: rgba(0, 50, 0, 0.5); border-radius: 25px; padding: 50px 40px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35); text-align: center; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); max-width: 450px; width: 100%; transition: transform 0.3s ease; }
  .card:hover { transform: scale(1.01); }
  .card h1 { font-size: 2.4em; margin-bottom: 25px; color: #ffffff; text-shadow: 2px 2px 6px rgba(0,0,0,0.4); }
  .visitors-line { font-size: 3em; font-weight: 600; color: #ffe066; text-shadow: 2px 2px 8px rgba(0,0,0,0.4); margin-bottom: 25px; }
  .weather { font-size: 1.5em; margin-top: 10px; line-height: 1.6; }
  .clock { margin-top: 25px; font-size: 1.6em; font-weight: 500; letter-spacing: 1px; }
  .footer { font-size: 1.2em; opacity: 0.9; margin-top: 30px; text-shadow: 1px 1px 3px rgba(0,0,0,0.4); }
  .cards-container { display: flex; justify-content: center; gap: 30px; width: 100%; }
</style>
</head>
<body>
<img src="wildlands_logo.png" alt="Wildlands Logo" class="logo fade-in">
<div class="cards-container fade-in">
  <div class="card">
    <h1>Bezoekersvoorspelling</h1>
    <div id="visitors-line" class="visitors-line">Vandaag verwacht: -- bezoekers</div>
    <div class="weather" id="weather">Weerdata ophalen...</div>
    <div class="clock" id="clock"></div>
  </div>
  <div class="card">
    <h1>Aangepaste voorspelling</h1>
    <div>
      <label>🌡️ Temperatuur (°C): <input type="number" id="input-temp" value="20"></label><br><br>
      <label>☔ Regen (mm): <input type="number" id="input-rain" value="0"></label><br><br>
      <label>🏖️ Vakantie? <select id="input-vacation"><option value="0">Nee</option><option value="1">Ja</option></select></label><br><br>
      <label>🎉 Evenement? <select id="input-event"><option value="0">Nee</option><option value="1">Ja</option></select></label><br><br>
      <label>📢 Campagne? <select id="input-campaign"><option value="0">Nee</option><option value="1">Ja</option></select></label><br><br>
      <button onclick="predictCustom()">Voorspel bezoekers</button>
    </div>
    <div id="custom-prediction" style="margin-top: 15px; font-size: 1.5em;"></div>
  </div>
</div>
<div class="footer">🌍 Wildlands Adventure Zoo Emmen — Dagelijkse bezoekersvoorspelling automatisch bijgewerkt</div>

<script>
async function loadPrediction() {
  try {
    const res = await fetch("http://127.0.0.1:5000/api/predict_today");
    const data = await res.json();
    document.getElementById("visitors-line").innerText =
      `Vandaag verwacht: ${data.predicted_visitors.toLocaleString()} bezoekers`;
    document.getElementById("weather").innerText =
      `🌦️ Temperatuur: ${data.temperature}°C | Regen: ${data.rain_mm} mm ${
        data.vacation ? "| 🏖️ Vakantie" : ""
      } ${data.event ? "| 🎉 Evenement" : ""} ${data.campaign ? "| 📢 Campagne" : ""}`;
  } catch (error) {
    document.getElementById("visitors-line").innerText = "⚠️ Geen verbinding met server";
    console.error("Error fetching prediction:", error);
  }
}

function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerText = now.toLocaleTimeString("nl-NL");
}

async function predictCustom() {
  const temp = parseFloat(document.getElementById('input-temp').value);
  const rain = parseFloat(document.getElementById('input-rain').value);
  const vacation = parseInt(document.getElementById('input-vacation').value);
  const event = parseInt(document.getElementById('input-event').value);
  const campaign = parseInt(document.getElementById('input-campaign').value);

  try {
    const res = await fetch('http://127.0.0.1:5000/api/predict_custom', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({temperature: temp, rain_mm: rain, vacation, event, campaign})
    });
    const data = await res.json();
    document.getElementById('custom-prediction').innerText =
      `Verwachte bezoekers: ${data.predicted_visitors.toLocaleString()}`;
  } catch (error) {
    document.getElementById('custom-prediction').innerText = "⚠️ Fout bij voorspelling";
    console.error(error);
  }
}

setInterval(updateClock, 1000);
updateClock();
loadPrediction();
setInterval(loadPrediction, 60 * 1000);
</script>
</body>
</html>
